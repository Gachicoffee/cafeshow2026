<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카페쇼 준비 코치</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 세로 스크롤. 위에서부터 '지금 할 일' → 결정 → 발주 → 다가올 일 순 */
:root{
  --paper:#ECECE9; --card:#F6F5F1; --ink:#151515; --sub:#5B5B58; --hair:#C9C8C0;
  --green:#00593B; --orange:#DE531E; --blue:#1C60AD; --red:#BB2E21;
  --f:"Pretendard","Noto Sans KR",system-ui,sans-serif; --mono:"Consolas","Menlo",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#16171a;--card:#1f2023;--ink:#e9e8e3;--sub:#a4a39b;--hair:#3a3b38;--green:#3fae80;--orange:#f07a47;--blue:#6fa2e3;--red:#e2685c;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#16171a;--card:#1f2023;--ink:#e9e8e3;--sub:#a4a39b;--hair:#3a3b38;--green:#3fae80;--orange:#f07a47;--blue:#6fa2e3;--red:#e2685c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6;word-break:keep-all;padding-inline:16px;padding-block:0 60px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding-block:12px 10px;border-bottom:1px solid var(--ink);z-index:5;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.bar a{color:inherit}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who button{font:inherit;font-size:14px;font-weight:700;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:6px 14px;cursor:pointer;min-height:36px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1{font-size:clamp(22px,6vw,30px);font-weight:900;line-height:1.3;margin:18px 0 0;text-wrap:balance}
.lead{color:var(--sub);margin:4px 0 0}
.dday{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dday div{border:1px solid var(--hair);padding:10px;display:flex;flex-direction:column;min-width:0}
.dday b{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
.dday span{font-size:12px;color:var(--sub)}
.dday .main{border-color:var(--ink);background:var(--card)}
section{display:flex;flex-direction:column;gap:10px}
h2{font-size:18px;font-weight:900;margin:0;display:flex;align-items:baseline;gap:8px;border-top:1px solid var(--ink);padding-top:10px}
h2 small{font-family:var(--mono);font-size:11px;color:var(--sub);font-weight:400}
.empty{color:var(--sub);font-size:14px;padding:8px 0}
.card{background:var(--card);border:1px solid var(--hair);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.late{border-left:4px solid var(--red)}
.card.today{border-left:4px solid var(--orange)}
.card.blocked{opacity:.92}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:700;font-size:15.5px}
.meta{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{font-size:11.5px;font-weight:700;border:1px solid currentColor;padding:0 7px;white-space:nowrap;line-height:1.7}
.c-red{color:var(--red)} .c-orange{color:var(--orange)} .c-blue{color:var(--blue)} .c-green{color:var(--green)} .c-sub{color:var(--sub)}
.note{font-size:13px;border-left:2px solid var(--hair);padding-left:8px;color:var(--sub)}
.block{font-size:13px;color:var(--red)}
details{border-top:1px dashed var(--hair);padding-top:6px}
summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--green);list-style:none;min-height:28px;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ ";}
details[open] summary::before{content:"－ ";}
.help{font-size:14px;display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.help ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:3px}
.copy{align-self:flex-start;font:inherit;font-size:13px;font-weight:700;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer;min-height:32px}
pre.msg{white-space:pre-wrap;font-family:var(--f);font-size:13.5px;background:var(--paper);border:1px solid var(--hair);padding:8px 10px;margin:0}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--hair);vertical-align:top}
th{font-size:12px;color:var(--sub);border-bottom:1px solid var(--ink);white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tl{display:flex;flex-direction:column;border-left:1px solid var(--ink);margin-left:4px}
.tl div{padding:5px 0 5px 14px;position:relative;font-size:14px}
.tl div::before{content:"";position:absolute;left:-4px;top:13px;width:7px;height:7px;background:var(--ink)}
.tl .past{color:var(--sub);text-decoration:line-through}
.tl b{font-variant-numeric:tabular-nums;display:inline-block;min-width:96px}
.banner{font-size:13px;border:1px solid var(--orange);color:var(--ink);padding:8px 10px;background:var(--card)}
.tips{display:flex;flex-direction:column;gap:8px}
.tip{border-left:3px solid var(--green);padding:2px 0 2px 10px;font-size:14px}
footer{font-size:12px;color:var(--sub);border-top:1px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="bar"><span>GACHI COFFEE · CAFE SHOW 2026 · CA107</span><span id="sync">불러오는 중…</span></div>
    <div class="who" role="group" aria-label="누구의 할 일을 볼까요">
      <button data-who="all" aria-pressed="true">전체</button>
      <button data-who="하빈" aria-pressed="false">하빈</button>
      <button data-who="지형" aria-pressed="false">지형(대표)</button>
    </div>
  </div>

  <header>
    <h1 id="greet">오늘 할 일을 정리하고 있어요</h1>
    <p class="lead" id="greetSub"></p>
  </header>

  <div class="dday" id="dday"></div>
  <div id="banner"></div>

  <section>
    <h2>지금 해야 해요 <small id="nowCount"></small></h2>
    <div id="now"></div>
  </section>

  <section>
    <h2>대표님 결정 대기 <small>결정이 늦으면 디자인 착수가 밀려요</small></h2>
    <div id="decisions"></div>
  </section>

  <section>
    <h2>발주 타이머 <small>발주 마감 = 입고 목표일 − 리드타임</small></h2>
    <div id="orders"></div>
  </section>

  <section>
    <h2>이번 주에 다가와요 <small>앞으로 7일</small></h2>
    <div id="soon"></div>
  </section>

  <section>
    <h2>주최측 마감 <small>매뉴얼 기준, 놓치면 되돌릴 수 없음</small></h2>
    <div class="tl" id="external"></div>
  </section>

  <section>
    <h2>이건 어때요</h2>
    <div class="tips" id="tips"></div>
  </section>

  <footer>
    <span>원본: <a id="sheetLink" href="#" target="_blank" rel="noopener">가치커피_카페쇼_준비플랜 (구글 시트)</a> · <a href="https://docs.google.com/document/d/1D9_7HJE2Vo-kwqS1CMeVwrQWtoxLXoTZqOw6daLJ4oU/edit" target="_blank" rel="noopener">준비 문서</a></span>
    <span>시트의 상태 칸에 "완료"라고 적으면 여기서 사라져요. 1분마다 다시 읽어요.</span>
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
